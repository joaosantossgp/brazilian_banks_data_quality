name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  offline-tests:
    name: Offline tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install offline Parquet dependency
        # One official binary dependency for offline Parquet tests; no financial data requests.
        run: |
          python -m pip install --no-deps --only-binary=:all: --require-hashes -r requirements-duckdb.txt
      - name: Python tests
        run: python -B -m unittest discover -s tests -v
      - name: Budget guards
        run: node tests/test-budget.cjs
      - name: Portal readiness tests
        run: node --test tests/test-portal-ready.cjs
