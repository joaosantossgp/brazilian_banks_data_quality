<title id="repository_architecture_20261012_title">Arquitetura em uso: duas rotas, contratos próprios</title>
<desc id="repository_architecture_20261012_desc">A base atual usa OData capturado. O portal anterior permanece para snapshots, replay e contratos aceitos. Setas = importação, leitura ou geração. Dados aceitos e manifests ficam locais; código/docs ficam no Git.</desc>
