<title id="monograph-research-map-20261013-title">Percurso da pesquisa monográfica</title>
<desc id="monograph-research-map-20261013-desc">Identidade e elegibilidade temporal de companhias na CVM/B3 e dados por perspectiva do IF.data sustentam o vínculo com conglomerados financeiros ou instituições independentes; a literatura orienta indicadores candidatos e análise, cujo método final permanece aberto.</desc>
