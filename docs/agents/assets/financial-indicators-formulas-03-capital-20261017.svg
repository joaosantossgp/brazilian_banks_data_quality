<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="03-capital-title 03-capital-desc"><title id="03-capital-title">Capital regulatório: dois conceitos</title><desc id="03-capital-desc">Fórmulas multiplicadas por 100, com contas e recortes. Controles publicados: IB 79664 e ICP 79659. Não são componentes extras. Sr é regime, não faixa de tamanho.</desc><style>text{font-family:Arial,sans-serif;fill:#2d3142}.mono{font-family:Consolas,monospace;fill:#4f5d75}.serif{font-family:Georgia,serif}.muted{fill:#4f5d75}.box{fill:#fff;stroke:#c4c8cf;stroke-width:1}.edge{fill:none;stroke:#89919e;stroke-width:1.5}</style><rect width="1280" height="720" fill="#f5f5f5"></rect><text x="40" y="36" font-size="14" class="mono">IF.DATA  /  FÓRMULAS POR RECORTE  /  2010–2024</text><text x="40" y="84" font-size="36" class="serif">Capital regulatório: dois conceitos</text><text x="40" y="116" font-size="18" class="muted">Prudencial · Capital (5) · TipoInstituicao=1 · série admitida: 2015–2024</text><path class="edge" d="M216 192 H240 Q248 192 248 184 Q248 176 256 176 H288"></path><path class="edge" d="M216 240 H240 Q248 240 248 248 Q248 256 256 256 H288"></path><rect class="box" x="40" y="172" width="176" height="96" rx="8"></rect><text x="52" y="206" font-size="19" class="">C3 · PR/RWA</text><text x="52" y="238" font-size="13" class="mono">ATUAL</text><rect class="box" x="288" y="148" width="560" height="56" rx="8"></rect><text x="300" y="171" font-size="19" class="">Patrimônio de Referência</text><text x="300" y="192" font-size="15" class="mono">PR = 79649 · Capital 5</text><rect class="box" x="288" y="228" width="560" height="56" rx="8"></rect><text x="300" y="251" font-size="19" class="">Ativos ponderados pelo risco</text><text x="300" y="272" font-size="15" class="mono">RWA = 79665 · Capital 5</text><line x1="288" y1="216" x2="848" y2="216" stroke="#2d3142"></line><text x="864" y="224" font-size="22" class="">× 100</text><text x="940" y="172" font-size="18" class="">Unidades prudenciais elegíveis</text><text x="940" y="204" font-size="16" class="muted">Índice total de capital</text><text x="940" y="228" font-size="16" class="muted">Estoque / estoque</text><text x="940" y="252" font-size="16" class="muted">PR não é capital principal.</text><path class="edge" d="M216 356 H240 Q248 356 248 348 Q248 340 256 340 H288"></path><path class="edge" d="M216 404 H240 Q248 404 248 412 Q248 420 256 420 H288"></path><rect class="box" x="40" y="336" width="176" height="96" rx="8"></rect><text x="52" y="370" font-size="19" class="">C4 · CP/RWA</text><text x="52" y="402" font-size="13" class="mono">ATUAL</text><rect class="box" x="288" y="312" width="560" height="56" rx="8"></rect><text x="300" y="335" font-size="19" class="">Capital principal</text><text x="300" y="356" font-size="15" class="mono">CP = 79645 · Capital 5</text><rect class="box" x="288" y="392" width="560" height="56" rx="8"></rect><text x="300" y="415" font-size="19" class="">Ativos ponderados pelo risco</text><text x="300" y="436" font-size="15" class="mono">RWA = 79665 · Capital 5</text><line x1="288" y1="380" x2="848" y2="380" stroke="#2d3142"></line><text x="864" y="388" font-size="22" class="">× 100</text><text x="940" y="336" font-size="18" class="">Unidades prudenciais elegíveis</text><text x="940" y="368" font-size="16" class="muted">Conceito mais restrito de capital</text><text x="940" y="392" font-size="16" class="muted">CP ausente não equivale a zero</text><text x="940" y="416" font-size="16" class="muted">Regime e divulgação condicionam uso.</text><line x1="40" y1="524" x2="1240" y2="524" stroke="#c4c8cf"></line><text x="40" y="560" font-size="14" class="mono">LEITURA ECONÔMICA</text><text x="40" y="592" font-size="23" class="serif">Fórmula calculável e interpretação adequada são verificações distintas.</text><line x1="40" y1="648" x2="1240" y2="648" stroke="#c4c8cf"></line><text x="40" y="674" font-size="16" class="muted">Controles publicados: IB 79664 e ICP 79659. Não são componentes extras. Sr é regime, não faixa de tamanho.</text><text x="40" y="702" font-size="13" class="mono">ATUAL: motor existente   ·   PROPOSTA: candidata, sem implementação   ·   Fonte detalhada e tratamento de ausências no guia</text></svg>
