<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="09-tcb-title 09-tcb-desc"><title id="09-tcb-title">Tcb: do grupo observado à pergunta econômica</title><desc id="09-tcb-desc">Recortes observados na matriz de cobertura. Exemplo Financeiro202412, sistema observado inteiro. Presença conjunta não é calculabilidade.</desc><style>text{font-family:Arial,sans-serif;fill:#2d3142}.serif{font-family:Georgia,serif}.mono{font-family:Consolas,monospace;fill:#4f5d75}.muted{fill:#4f5d75}</style><rect width="1280" height="720" fill="#f5f5f5"></rect><text x="40" y="36" font-size="14" class="mono">IF.DATA  /  CATEGORIAS OBSERVADAS → USO ANALÍTICO  /  SISTEMA INTEIRO</text><text x="40" y="84" font-size="36" class="serif">Tcb: do grupo observado à pergunta econômica</text><text x="40" y="116" font-size="18" class="muted">Financeiro · 202412 · 1.422 unidades · pistas de negócio, sem de-para automático por nome</text><rect x="40" y="148" width="584" height="96" rx="8" fill="#fff" stroke="#c4c8cf"></rect><text x="56" y="176" font-size="21" class="">B1  ·  97 unidades</text><text x="56" y="201" font-size="17" class="">Bancos comerciais/múltiplos e caixas</text><text x="56" y="226" font-size="16" class="muted">L2/L3 com depósitos; LA/LC/LF e composição</text><rect x="656" y="148" width="584" height="96" rx="8" fill="#fff" stroke="#c4c8cf"></rect><text x="672" y="176" font-size="21" class="">B2  ·  31 unidades</text><text x="672" y="201" font-size="17" class="">Múltiplos sem carteira comercial, investimento/câmbio</text><text x="672" y="226" font-size="16" class="muted">RS e composição; L2/L3 somente se pertinentes</text><rect x="40" y="260" width="584" height="96" rx="8" fill="#fff" stroke="#c4c8cf"></rect><text x="56" y="288" font-size="21" class="">B3S  ·  753 unidades</text><text x="56" y="313" font-size="17" class="">Cooperativas singulares</text><text x="56" y="338" font-size="16" class="muted">Q1/Q2; LA/LF; retorno como sustentabilidade</text><rect x="656" y="260" width="584" height="96" rx="8" fill="#fff" stroke="#c4c8cf"></rect><text x="672" y="288" font-size="21" class="">B3C  ·  29 unidades</text><text x="672" y="313" font-size="17" class="">Centrais/confederações cooperativas</text><text x="672" y="338" font-size="16" class="muted">Carteira própria, centralização e renda de serviços</text><rect x="40" y="372" width="584" height="96" rx="8" fill="#fff" stroke="#c4c8cf"></rect><text x="56" y="400" font-size="21" class="">B4  ·  4 unidades</text><text x="56" y="425" font-size="17" class="">Bancos de desenvolvimento</text><text x="56" y="450" font-size="16" class="muted">LA/LC/LF prioritários; L2 isolado insuficiente</text><rect x="656" y="372" width="584" height="96" rx="8" fill="#fff" stroke="#c4c8cf"></rect><text x="672" y="400" font-size="21" class="">N1  ·  226 unidades</text><text x="672" y="425" font-size="17" class="">Crédito não bancário</text><text x="672" y="450" font-size="16" class="muted">Q1/Q2 com carteira compatível; LA/LC/LF</text><rect x="40" y="484" width="584" height="96" rx="8" fill="#fff" stroke="#c4c8cf"></rect><text x="56" y="512" font-size="21" class="">N2  ·  136 unidades</text><text x="56" y="537" font-size="17" class="">Mercado de capitais e câmbio</text><text x="56" y="562" font-size="16" class="muted">RS; LA restrita; obrigações com clientes faltam</text><rect x="656" y="484" width="584" height="96" rx="8" fill="#fff" stroke="#c4c8cf"></rect><text x="672" y="512" font-size="21" class="">N4  ·  146 unidades</text><text x="672" y="537" font-size="17" class="">Pagamentos</text><text x="672" y="562" font-size="16" class="muted">RS; LA/E3 restritos; falta medir salvaguarda</text><text x="40" y="628" font-size="18" class="">Base comum: R1/R2/C1 e E2-B com conceito compatível. C3/C4 ficam no perímetro prudencial próprio.</text><text x="40" y="660" font-size="17" class="">Tcb não substitui SegmentoTb: verificar seus rótulos e a composição de ativos, receitas e passivos.</text><text x="40" y="692" font-size="15" class="mono">Oito tokens no Financeiro com valores. B3/N3 do cadastro geral histórico não têm de-para confirmado.</text></svg>
