<g data-node="capture" data-box="80 160 240 140">
<rect x="80" y="160" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#bfc0c0"/>
<text class="name" x="96" y="186">Captura arquivada</text>
<text class="tag" x="96" y="203">source_capture</text>
<line x1="80" y1="212" x2="320" y2="212" stroke="#bfc0c0"/>
<text class="mono" x="96" y="230"># capture_id</text>
<text class="mono" x="96" y="246">body_sha256 / URL / UTC</text>
<text class="mono" x="96" y="262">status e contexto original</text>
</g>
<g data-node="membership" data-box="440 160 240 140">
<rect x="440" y="160" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#bfc0c0"/>
<text class="name" x="456" y="186">Membro de fonte</text>
<text class="tag" x="456" y="203">source_membership</text>
<line x1="440" y1="212" x2="680" y2="212" stroke="#bfc0c0"/>
<text class="mono" x="456" y="230"># snapshot_id + role + ordinal</text>
<text class="mono" x="456" y="246">→ capture_id</text>
<text class="mono" x="456" y="262">papel no conjunto recuperado</text>
</g>
<g data-node="snapshot" data-box="800 160 240 140">
<rect x="800" y="160" width="240" height="140" rx="6" fill="#f4eee9" stroke="#eb6c36"/>
<text class="name" x="816" y="186">Snapshot aceito</text>
<text class="tag" x="816" y="203">snapshot</text>
<line x1="800" y1="212" x2="1040" y2="212" stroke="#bfc0c0"/>
<text class="mono" x="816" y="230"># snapshot_id</text>
<text class="mono" x="816" y="246">seleção / contrato / perfil</text>
<text class="mono" x="816" y="262">arquivos e versões explícitos</text>
</g>
<g data-node="entity" data-box="80 376 240 140">
<rect x="80" y="376" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#bfc0c0"/>
<text class="name" x="96" y="402">Ocorrência de entidade</text>
<text class="tag" x="96" y="419">entity_occurrence</text>
<line x1="80" y1="428" x2="320" y2="428" stroke="#bfc0c0"/>
<text class="mono" x="96" y="446"># snapshot_id + entity_locator</text>
<text class="mono" x="96" y="462">código e namespace observados</text>
<text class="mono" x="96" y="478">referência / perspectiva</text>
</g>
<g data-node="cell" data-box="440 376 240 140">
<rect x="440" y="376" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#bfc0c0"/>
<text class="name" x="456" y="402">Célula</text>
<text class="tag" x="456" y="419">cell</text>
<line x1="440" y1="428" x2="680" y2="428" stroke="#bfc0c0"/>
<text class="mono" x="456" y="446"># snapshot + ocorrência + binding</text>
<text class="mono" x="456" y="462">+ cell_locator definido pelo perfil</text>
<text class="mono" x="456" y="478">presença / estado / token / Decimal</text>
</g>
<g data-node="binding" data-box="800 376 240 140">
<rect x="800" y="376" width="240" height="140" rx="6" fill="#f5f5f5" stroke="#bfc0c0"/>
<text class="name" x="816" y="402">Binding de variável</text>
<text class="tag" x="816" y="419">variable_binding</text>
<line x1="800" y1="428" x2="1040" y2="428" stroke="#bfc0c0"/>
<text class="mono" x="816" y="446"># snapshot_id + binding_locator</text>
<text class="mono" x="816" y="462">definição e IDs oficiais</text>
<text class="mono" x="816" y="478">unidade / janela / perímetro</text>
</g>
<g data-node="origin" data-box="440 576 240 96">
<rect x="440" y="576" width="240" height="96" rx="6" fill="#f5f5f5" stroke="#bfc0c0"/>
<text class="name" x="456" y="602">Origem da célula</text>
<text class="tag" x="456" y="619">cell_origin</text>
<line x1="440" y1="628" x2="680" y2="628" stroke="#bfc0c0"/>
<text class="mono" x="456" y="646">→ chave da célula / membro</text>
<text class="mono" x="456" y="662"># evidence_kind + locator</text>
</g>
<text class="note" x="80" y="584">Observações: células armazenadas.</text>
<text class="note" x="80" y="604">Cobertura: grade definida pelo perfil.</text>
<text class="note" x="800" y="584">CVM/B3 e recortes analíticos:</text>
<text class="note" x="800" y="604">camada temporal descrita na spec.</text>
<text class="tag" x="80" y="704">1 / N = CARDINALIDADE · CAIXAS LÓGICAS, NÃO TABELAS IMPLANTADAS · PADRÃO CLARO</text>
</svg>
