<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="logical-model-title logical-model-desc" id="logical-data-model-root">
<title id="logical-model-title">Modelo lógico proposto da base IF.data</title>
<desc id="logical-model-desc">Sete entidades lógicas: captura, membro de fonte, snapshot, ocorrência de entidade, binding de variável, célula e origem. O snapshot delimita o conjunto recuperado; células pertencem a uma ocorrência e binding compatíveis; origens referenciam membros de fonte. Este é desenho para revisão, sem tabelas implantadas ou identidade econômica universal.</desc>
<defs>
      <style>#logical-data-model-root { color: #2d3142; font-family: 'Geist','Segoe UI',Arial,sans-serif; }
      #logical-data-model-root .diagram-container { width:100%; overflow-x:auto; }
      #logical-data-model-root .diagram-container { overflow-x:visible; }
      #logical-data-model-root text { fill:#2d3142; font-family:'Geist','Segoe UI',Arial,sans-serif; }
      #logical-data-model-root .title { font-family:'Instrument Serif',Georgia,serif; font-size:28px; }
      #logical-data-model-root .name { font-size:14px; font-weight:600; }
      #logical-data-model-root .mono { font-family:'Geist Mono',Consolas,monospace; font-size:9px; }
      #logical-data-model-root .tag { font-family:'Geist Mono',Consolas,monospace; font-size:8px; fill:#4f5d75; }
      #logical-data-model-root .note { font-size:11px; fill:#4f5d75; }
      #logical-data-model-root .cardinality { font-family:'Geist Mono',Consolas,monospace; font-size:8px; fill:#4f5d75; }
      #logical-data-model-root .edge { fill:none; stroke:#4f5d75; stroke-width:1.3; }</style>
<marker id="logical-data-model-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#4f5d75"/></marker>
<marker id="logical-data-model-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#eb6c36"/></marker>
<marker id="logical-data-model-arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0,8 3,0 6" fill="#2e5aa8"/></marker>
</defs>
<rect width="1280" height="720" fill="#f5f5f5"/>
<text class="tag" x="80" y="48">PROPOSTA · ISSUE 27 · 04 OUT 2026</text>
<text class="title" x="80" y="88">Modelo lógico da base IF.data</text>
<text class="note" x="80" y="116">Versões e fontes explícitas; identidade entre períodos e perspectivas depende de evidência.</text>

