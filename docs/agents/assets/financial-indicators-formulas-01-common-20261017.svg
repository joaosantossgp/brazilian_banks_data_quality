egócios*</text><text x="940" y="204" font-size="16" class="muted">Resultado sobre recursos</text><text x="940" y="228" font-size="16" class="muted">Janela trimestral ou TTM</text><text x="940" y="252" font-size="16" class="muted">Não mede mandato público.</text><path class="edge" d="M216 356 H240 Q248 356 248 348 Q248 340 256 340 H288"></path><path class="edge" d="M216 404 H240 Q248 404 248 412 Q248 420 256 420 H288"></path><rect class="box" x="40" y="336" width="176" height="96" rx="8"></rect><text x="52" y="370" font-size="19" class="">R2 · ROE</text><text x="52" y="402" font-size="13" class="mono">ATUAL</text><rect class="box" x="288" y="312" width="560" height="56" rx="8"></rect><text x="300" y="335" font-size="19" class="">Lucro líquido da janela</text><text x="300" y="356" font-size="15" class="mono">LL = 78187 · Resumo 1</text><rect class="box" x="288" y="392" width="560" height="56" rx="8"></rect><text x="300" y="415" font-size="19" class="">Patrimônio líquido médio na janela</text><text x="300" y="436" font-size="15" class="mono">PL = 78186 · Resumo 1</text><line x1="288" y1="380" x2="848" y2="380" stroke="#2d3142"></line><text x="864" y="388" font-size="22" class="">× 100</text><text x="940" y="336" font-size="18" class="">Todos os negócios*</text><text x="940" y="368" font-size="16" class="muted">Retorno contábil do capital</text><text x="940" y="392" font-size="16" class="muted">PL ≤ 0: sinalizar interpretação</text><text x="940" y="416" font-size="16" class="muted">Não confundir com custo de capital.</text><path class="edge" d="M216 520 H240 Q248 520 248 512 Q248 504 256 504 H288"></path><path class="edge" d="M216 568 H240 Q248 568 248 576 Q248 584 256 584 H288"></path><rect class="box" x="40" y="500" width="176" height="96" rx="8"></rect><text x="52" y="534" font-size="19" class="">C1 · PL/AT</text><text x="52" y="566" font-size="13" class="mono">ATUAL</text><rect class="box" x="288" y="476" width="560" height="56" rx="8"></rect><text x="300" y="499" f