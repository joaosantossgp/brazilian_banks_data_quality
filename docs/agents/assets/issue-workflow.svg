<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-labelledby="issue-workflow-title issue-workflow-desc" id="issue-workflow-root">
  <title id="issue-workflow-title">Workflow de Issues</title>
  <desc id="issue-workflow-desc">Contrato completo permite conferir a prontidão: pendências bloqueiam a tarefa afetada, enquanto duas Issues prontas da mesma área podem executar em paralelo com ownership compatível, revisão independente, checks e conclusão conforme a natureza da entrega.</desc>
  <defs>
      <style>#issue-workflow-root { color: #2d3142; font-family: 'Geist', 'Segoe UI', Arial, sans-serif; }
      #issue-workflow-root .diagram-container { width: 100%; overflow-x: auto; }
      #issue-workflow-root text { fill: #2d3142; font-family: 'Geist', 'Segoe UI', Arial, sans-serif; }
      #issue-workflow-root .title { font-family: 'Instrument Serif', Georgia, 'Times New Roman', serif; font-size: 40px; font-weight: 400; }
      #issue-workflow-root .name { font-size: 16px; font-weight: 600; }
      #issue-workflow-root .detail { font-size: 12px; font-weight: 400; fill: #4f5d75; }
      #issue-workflow-root .technical { font-family: 'Geist Mono', Consolas, 'Courier New', monospace; font-size: 12px; fill: #4f5d75; }
      #issue-workflow-root .group-heading { font-size: 14px; font-weight: 600; fill: #4f5d75; }
      #issue-workflow-root .edge-label { font-family: 'Geist Mono', Consolas, 'Courier New', monospace; font-size: 12px; fill: #4f5d75; }
      #issue-workflow-root .edge { fill: none; stroke: #4f5d75; stroke-width: 1.5; marker-end: url(#issue-workflow-arrow); }
      #issue-workflow-root .box { fill: #ffffff; stroke: #2d3142; stroke-width: 1; }
      #issue-workflow-root .focal { fill: #f4ebe6; stroke: #eb6c36; stroke-width: 1.5; }
      #issue-workflow-root .blocked { fill: #ececec; stroke: #4f5d75; stroke-width: 1; }
      #issue-workflow-root .diagram-container { overflow-x: visible; }</style>
    <marker id="issue-workflow-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
  </defs>
  <rect width="1280" height="720" fill="#f5f5f5"/>
  <text class="title" x="40" y="72">Da Issue pronta à entrega verificada</text>
  <text class="detail" x="40" y="96">Contrato obrigatório · prontidão positiva · autonomia dentro do escopo aprovado</text>

  <!-- Connectors precede boxes. Every route has its own attach point. -->
  <g id="connectors">
    <path id="contract-decision" class="edge" d="M 340 200 V 224"/>
    <path id="decision-blocked" class="edge" d="M 340 352 V 412"/>
    <path id="decision-ready" class="edge" d="M 540 288 H 688"/>
    <path id="ready-execution-a" class="edge" d="M 832 328 V 336 Q 832 344 824 344 H 736 Q 728 344 728 352 V 368"/>
    <path id="ready-execution-b" class="edge" d="M 976 328 V 336 Q 976 344 984 344 H 1072 Q 1080 344 1080 352 V 368"/>
    <path id="execution-review-a" class="edge" d="M 728 440 V 480"/>
    <path id="execution-review-b" class="edge" d="M 1080 440 V 480"/>
    <path id="review-conclusion-a" class="edge" d="M 728 552 V 592"/>
    <path id="review-conclusion-b" class="edge" d="M 1080 552 V 592"/>
  </g>
  <g id="branch-labels">
    <rect x="592" y="260" width="48" height="20" fill="#f5f5f5"/>
    <text class="edge-label" x="616" y="274" text-anchor="middle">SIM</text>
    <rect x="348" y="372" width="48" height="20" fill="#f5f5f5"/>
    <text class="edge-label" x="372" y="386" text-anchor="middle">NÃO</text>
  </g>

  <g id="contract" data-node="contract" data-box="160 112 360 88">
    <rect class="box" x="160" y="112" width="360" height="88" rx="20"/>
    <text class="name" x="184" y="142">Contrato completo</text>
    <text class="detail" x="184" y="166">Domínio · workflow · skills</text>
    <text class="detail" x="184" y="184">Responsável · paths · aceite</text>
  </g>
  <g id="readiness-decision" data-node="decision" data-box="140 224 400 128">
    <polygon class="box" points="340,224 540,288 340,352 140,288"/>
    <text class="name" x="340" y="268" text-anchor="middle">Escopo, entradas</text>
    <text class="name" x="340" y="292" text-anchor="middle">e dependências</text>
    <text class="name" x="340" y="316" text-anchor="middle">satisfeitos?</text>
  </g>
  <g id="blocked" data-node="blocked" data-box="160 412 360 104">
    <rect class="blocked" x="160" y="412" width="360" height="104" rx="6"/>
    <text class="name" x="184" y="442">Registrar requisito pendente</text>
    <text class="technical" x="184" y="466">status:blocked</text>
    <text class="detail" x="184" y="490">Blocker + condição de desbloqueio</text>
    <text class="detail" x="184" y="506">Bloqueia apenas o recorte afetado.</text>
  </g>
  <g id="ready" data-node="ready" data-box="688 248 432 80">
    <rect class="focal" x="688" y="248" width="432" height="80" rx="6"/>
    <text class="name" x="712" y="274">Prontidão confirmada</text>
    <text class="technical" x="712" y="296">status:ready explícito</text>
    <text class="detail" x="712" y="316">Escopo aprovado, sem pendências para iniciar.</text>
  </g>
  <text class="group-heading" x="904" y="232" text-anchor="middle">Mesma área; paralelismo com ownership compatível</text>
  <g id="execution-a" data-node="execution-a" data-box="608 368 240 72">
    <rect class="box" x="608" y="368" width="240" height="72" rx="6"/>
    <text class="name" x="632" y="396">Executar Issue A</text>
    <text class="detail" x="632" y="420">Destino A · allowlist própria</text>
  </g>
  <g id="execution-b" data-node="execution-b" data-box="960 368 240 72">
    <rect class="box" x="960" y="368" width="240" height="72" rx="6"/>
    <text class="name" x="984" y="396">Executar Issue B</text>
    <text class="detail" x="984" y="420">Destino B · allowlist própria</text>
  </g>
  <g id="review-a" data-node="review-a" data-box="592 480 272 72">
    <rect class="box" x="592" y="480" width="272" height="72" rx="6"/>
    <text class="name" x="616" y="506">Revisão independente A</text>
    <text class="detail" x="616" y="530">Checks pertinentes · aceite</text>
  </g>
  <g id="review-b" data-node="review-b" data-box="944 480 272 72">
    <rect class="box" x="944" y="480" width="272" height="72" rx="6"/>
    <text class="name" x="968" y="506">Revisão independente B</text>
    <text class="detail" x="968" y="530">Checks pertinentes · aceite</text>
  </g>
  <g id="conclusion" data-node="conclusion" data-box="592 592 624 64">
    <rect class="box" x="592" y="592" width="624" height="64" rx="20"/>
    <text class="name" x="616" y="616">Concluir cada Issue com evidência</text>
    <text class="detail" x="616" y="640">PR: integração + CI pós-merge · Pesquisa/decisão: artefato + aceite</text>
  </g>

  <!-- Horizontal bottom legend, separate from the flow. -->
  <line x1="40" y1="672" x2="1240" y2="672" stroke="#bfc0c0" stroke-width="1"/>
  <polygon points="48,686 56,692 48,698 40,692" fill="none" stroke="#4f5d75"/>
  <text class="detail" x="64" y="696">Decisão</text>
  <rect x="156" y="686" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142"/>
  <text class="detail" x="180" y="696">Etapa</text>
  <rect x="260" y="686" width="20" height="12" rx="6" fill="#ffffff" stroke="#2d3142"/>
  <text class="detail" x="288" y="696">Início/fim</text>
  <text class="detail" x="416" y="696">Ilustrativo: não confirma execução paralela de Issues reais.</text>
</svg>
