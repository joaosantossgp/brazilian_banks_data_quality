<title id="ifdata_tables_20261012_title">Como as tabelas e views se conectam</title>
<desc id="ifdata_tables_20261012_desc">Mapa das estruturas atuais. As conexões são joins/derivações do código; não há PK/FK físicas implantadas. 4.464 valores sem cadastro foram preservados. JSON de componentes mantém proveniência; não existe FK simples ao catálogo.</desc>
